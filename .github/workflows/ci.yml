name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: cross-compile shared packages for biscuit
        run: |
          GOOS=linux GOARCH=arm CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm CGO_ENABLED=0 go build -tags noasm ./...
      - name: check formatting
        run: test -z "$(gofmt -l .)"
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - api: 25
            prefix: echolocal
          - api: 27
            prefix: lanovo
    steps:
      - uses: actions/checkout@v7
      - name: install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - run: make -f native/Makefile all API=${{ matrix.api }} PREFIX=${{ matrix.prefix }} OUT="$RUNNER_TEMP/helpers"
      - run: make -f native/Makefile test OUT="$RUNNER_TEMP/native-tests"
